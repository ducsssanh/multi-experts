---
# ====================================
# Frontend Service (NodePort)
# Expose frontend ra bên ngoài cluster
# Truy cập qua http://<worker-ip>:30000
# ====================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: multiexpert
  labels:
    app: multiexpert
    component: frontend
spec:
  type: NodePort
  selector:
    app: multiexpert
    component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
      protocol: TCP
