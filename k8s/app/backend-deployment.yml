---
# ====================================
# Backend Deployment
# FastAPI application (uvicorn)
# ====================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: multiexpert
  labels:
    app: multiexpert
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multiexpert
      component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: multiexpert
        component: backend
    spec:
      # Ưu tiên schedule trên worker nodes
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist

      containers:
        - name: backend
          image: ducsssanh13/multiexpert-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: app-config

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: data
              mountPath: /app/data

      volumes:
        - name: data
          emptyDir: {}
