---
# ====================================
# Frontend Deployment
# Next.js application (standalone mode)
# ====================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: multiexpert
  labels:
    app: multiexpert
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multiexpert
      component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: multiexpert
        component: frontend
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist

      containers:
        - name: frontend
          image: ducsssanh13/multiexpert-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000

          env:
            - name: BACKEND_URL
              value: "http://backend:8000"
            - name: NODE_ENV
              value: "production"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
