---
# ====================================
# Ansible Playbook: Deploy Application to K8s
# ====================================
# Chạy: ansible-playbook deploy-app.yml
#
# Prerequisites:
#   - K8s cluster đã chạy (site.yml đã apply)
#   - Jenkins đã được cài đặt
#   - Docker Hub credentials đã được cấu hình
# ====================================

# ---------- Play 1: Cài Docker + tools trên tất cả K8s nodes ----------
- name: "[Setup] Install Docker + tools on all K8s nodes"
  hosts: k8s_cluster
  become: true
  tasks:
    - name: Check if Docker is installed
      command: docker --version
      register: docker_check
      ignore_errors: true
      changed_when: false

    - name: Install Docker
      when: docker_check.rc != 0
      block:
        - name: Install Docker prerequisites
          apt:
            name:
              - ca-certificates
              - curl
              - gnupg
              - lsb-release
            state: present
            update_cache: true

        - name: Add Docker GPG key
          shell: |
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            chmod a+r /etc/apt/keyrings/docker.gpg
          args:
            creates: /etc/apt/keyrings/docker.gpg

        - name: Add Docker repository
          apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present
            filename: docker

        - name: Install Docker CE
          apt:
            name:
              - docker-ce
              - docker-ce-cli
              - docker-buildx-plugin
            state: present
            update_cache: true

        - name: Start and enable Docker
          systemd:
            name: docker
            state: started
            enabled: true

        - name: Add ubuntu user to docker group
          user:
            name: ubuntu
            groups: docker
            append: true

# ---------- Play 2: Cài tools trên Jenkins node ----------
- name: "[Setup] Install CI/CD tools on Jenkins pod"
  hosts: control_plane
  become: false
  tasks:
    - name: Get Jenkins pod name
      shell: kubectl get pod -n jenkins -l app=jenkins -o jsonpath='{.items[0].metadata.name}'
      register: jenkins_pod
      changed_when: false

    - name: Check if Snyk is installed in Jenkins
      shell: |
        kubectl exec -n jenkins {{ jenkins_pod.stdout }} -- \
          bash -c 'ls /var/jenkins_home/snyk 2>/dev/null && echo "found" || echo "not-found"'
      register: snyk_check
      changed_when: false

    - name: Install Snyk CLI in Jenkins pod
      when: "'not-found' in snyk_check.stdout"
      shell: |
        kubectl exec -n jenkins {{ jenkins_pod.stdout }} -- \
          bash -c '
            curl -fsSL https://static.snyk.io/cli/latest/snyk-linux -o /var/jenkins_home/snyk && \
            chmod +x /var/jenkins_home/snyk && \
            /var/jenkins_home/snyk --version
          '
      register: snyk_install

    - name: Print Snyk version
      debug:
        msg: "Snyk installed: {{ snyk_install.stdout | default(snyk_check.stdout) }}"

    - name: Install kubectl in Jenkins pod
      shell: |
        kubectl exec -n jenkins {{ jenkins_pod.stdout }} -- \
          bash -c '
            if [ ! -f /var/jenkins_home/kubectl ]; then
              curl -fsSLo /var/jenkins_home/kubectl \
                "https://dl.k8s.io/release/v1.29.15/bin/linux/amd64/kubectl" && \
              chmod +x /var/jenkins_home/kubectl
            fi
            /var/jenkins_home/kubectl version --client
          '
      register: kubectl_install

    - name: Print kubectl version
      debug:
        msg: "{{ kubectl_install.stdout }}"

# ---------- Play 3: Configure Jenkins kubeconfig ----------
- name: "[Setup] Configure Jenkins kubeconfig for K8s access"
  hosts: control_plane
  become: false
  tasks:
    - name: Get Jenkins pod name
      shell: kubectl get pod -n jenkins -l app=jenkins -o jsonpath='{.items[0].metadata.name}'
      register: jenkins_pod
      changed_when: false

    - name: Get current kubeconfig
      shell: cat ~/.kube/config
      register: kubeconfig
      changed_when: false

    - name: Copy kubeconfig to Jenkins pod
      shell: |
        kubectl exec -n jenkins {{ jenkins_pod.stdout }} -- \
          bash -c 'mkdir -p /var/jenkins_home/.kube'
        kubectl cp ~/.kube/config jenkins/{{ jenkins_pod.stdout }}:/var/jenkins_home/.kube/config
      register: kubeconfig_copy

    - name: Verify kubectl access from Jenkins
      shell: |
        kubectl exec -n jenkins {{ jenkins_pod.stdout }} -- \
          bash -c 'export KUBECONFIG=/var/jenkins_home/.kube/config && /var/jenkins_home/kubectl get nodes'
      register: kubectl_verify

    - name: Print kubectl verify
      debug:
        msg: "{{ kubectl_verify.stdout_lines }}"

# ---------- Play 4: Deploy application manifests ----------
- name: "[Deploy] Apply K8s manifests for the application"
  hosts: control_plane
  become: false
  tasks:
    - name: Create manifest directory on control plane
      file:
        path: /home/ubuntu/k8s/app
        state: directory

    - name: Copy application manifests
      copy:
        src: "{{ item }}"
        dest: /home/ubuntu/k8s/app/
      loop:
        - ../k8s/app/namespace.yml
        - ../k8s/app/configmap.yml
        - ../k8s/app/secrets.yml
        - ../k8s/app/backend-deployment.yml
        - ../k8s/app/backend-service.yml
        - ../k8s/app/frontend-deployment.yml
        - ../k8s/app/frontend-service.yml

    - name: Apply namespace
      shell: kubectl apply -f /home/ubuntu/k8s/app/namespace.yml

    - name: Apply configmap and secrets
      shell: |
        kubectl apply -f /home/ubuntu/k8s/app/configmap.yml
        kubectl apply -f /home/ubuntu/k8s/app/secrets.yml

    - name: Apply services
      shell: |
        kubectl apply -f /home/ubuntu/k8s/app/backend-service.yml
        kubectl apply -f /home/ubuntu/k8s/app/frontend-service.yml

    - name: Apply deployments
      shell: |
        kubectl apply -f /home/ubuntu/k8s/app/backend-deployment.yml
        kubectl apply -f /home/ubuntu/k8s/app/frontend-deployment.yml

    - name: Wait for backend deployment
      shell: kubectl rollout status deployment/backend -n multiexpert --timeout=120s
      register: backend_status
      retries: 3
      delay: 10
      until: backend_status.rc == 0
      ignore_errors: true

    - name: Wait for frontend deployment
      shell: kubectl rollout status deployment/frontend -n multiexpert --timeout=120s
      register: frontend_status
      retries: 3
      delay: 10
      until: frontend_status.rc == 0
      ignore_errors: true

    - name: Show deployment status
      shell: |
        echo "=== Pods ==="
        kubectl get pods -n multiexpert -o wide
        echo ""
        echo "=== Services ==="
        kubectl get svc -n multiexpert
      register: deploy_output

    - name: Print deployment status
      debug:
        msg: "{{ deploy_output.stdout_lines }}"

    - name: Get worker node IP for frontend access
      shell: kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}'
      register: worker_ip

    - name: Print access info
      debug:
        msg:
          - "========================================="
          - "✅ Application deployed to K8s!"
          - "========================================="
          - "🌐 Frontend: http://{{ worker_ip.stdout }}:30000"
          - "🔧 Backend:  http://{{ worker_ip.stdout }}:30000/api/health"
          - "========================================="
          - ""
          - "SSH Tunnel để truy cập từ browser:"
          - "  ssh -L 3000:{{ worker_ip.stdout }}:30000 -i ~/AWS/multi-expert.pem ubuntu@<BASTION_IP>"
          - "  → Mở http://localhost:3000"
