---
# ====================================
# Role: common
# Cài đặt prerequisites cho tất cả K8s nodes
# ====================================

# ---------- 1. System Preparation ----------

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Disable swap (K8s requirement)
  shell: swapoff -a

- name: Remove swap from fstab (persist after reboot)
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load required kernel modules
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules across reboots
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: Set sysctl params for K8s networking
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: true
  loop:
    - { key: "net.bridge.bridge-nf-call-iptables",  value: "1" }
    - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { key: "net.ipv4.ip_forward",                  value: "1" }

# ---------- 2. Install containerd ----------

- name: Install prerequisite packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
    state: present

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key
  shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install containerd
  apt:
    name: containerd.io
    state: present
    update_cache: true

- name: Remove default containerd config (has disabled CRI plugin)
  file:
    path: /etc/containerd/config.toml
    state: absent

- name: Generate proper containerd config with CRI enabled
  shell: containerd config default > /etc/containerd/config.toml

- name: Enable SystemdCgroup in containerd
  replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'

- name: Restart and enable containerd
  systemd:
    name: containerd
    state: restarted
    enabled: true
    daemon_reload: true

- name: Wait for containerd socket to be ready
  wait_for:
    path: /var/run/containerd/containerd.sock
    timeout: 30

# ---------- 3. Install kubeadm, kubelet, kubectl ----------

- name: Add Kubernetes GPG key
  shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    chmod a+r /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Add Kubernetes repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"
    state: present
    filename: kubernetes

- name: Install kubeadm, kubelet, kubectl
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true

- name: Hold K8s packages (prevent auto-upgrade)
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Enable kubelet service
  systemd:
    name: kubelet
    enabled: true

# ---------- Fix: Ubuntu systemd-resolved stub (127.0.0.53) không work trong pods ----------
# CoreDNS dùng dnsPolicy:Default → đọc /etc/resolv.conf của node → 127.0.0.53
# Nhưng 127.0.0.53 là systemd-resolved trên node namespace, pods không truy cập được
# Fix: kubelet dùng resolv.conf thật (có VPC DNS 10.0.0.2) thay vì stub

- name: Configure kubelet to use real resolv.conf (not systemd-resolved stub)
  copy:
    dest: /etc/default/kubelet
    content: 'KUBELET_EXTRA_ARGS=--resolv-conf=/run/systemd/resolve/resolv.conf'
    mode: "0644"

# ---------- 4. Install Helm (for Cilium) ----------

- name: Install Helm
  shell: |
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm
